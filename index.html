<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القباع جيمر | Alqba Gamer</title>
    <style>
        /* إعادة ضبط العناصر الأساسية */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a; /* أسود/كحلي داكن جداً */
            color: #f8fafc; /* أبيض ناصع */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* الهيدر والعنوان */
        header {
            text-align: center;
            margin-top: 50px;
        }

        .profile-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            background-color: #2563eb; /* أزرق نظيف */
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* الكارت الرئيسي */
        main {
            width: 100%;
            max-width: 500px;
            margin: 30px 0;
        }

        .card {
            background-color: #1e293b; /* أسود رمادي داكن */
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .card h2 {
            font-size: 1.3rem;
            color: #38bdf8; /* أزرق فاتح */
            margin-bottom: 15px;
        }

        .card p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        /* الأزرار وروابط التواصل */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid #475569;
            color: #f1f5f9;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        /* الفوتر */
        footer {
            margin-bottom: 20px;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- العلوية -->
    <header>
        <h1 class="profile-title">القباع جيمر</h1>
        <span class="badge">تطوير ألعاب & محتوى</span>
    </header>

    <!-- المحتوى الرئيسي -->
    <main>
        <div class="card">
            <h2>أهلاً بك!</h2>
            <p>أهلاً بك في الموقع الرسمي. يتم تطوير الموقع والمشاريع باستمرار، يمكنك متابعة الجديد عبر الروابط أدناه.</p>
            
            <div class="links-container">
                <a href="https://youtube.com" target="_blank" class="btn">قناة اليوتيوب</a>
                <button class="btn btn-secondary" onclick="showMessage()">مشروع اللعبة الحالية</button>
            </div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; <span id="year"></span> - القباح استديو</p>
    </footer>

    <!-- الجافاسكريبت -->
    <script>
        // تحديث السنة تلقائياً
        document.getElementById('year').innerText = new Date().getFullYear();

        // تفاعل بسيط للزر
        function showMessage() {
            alert("اللعبة قيد التطوير حالياً! انظر التحديثات القادمة قريباً.");
        }
    </script>
</body>
</html>
